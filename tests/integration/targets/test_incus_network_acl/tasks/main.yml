---
- name: Ensure incus network acl
  block:
    - name: Ensure incus network acl present (socket)
      ansible.builtin.import_tasks: present_socket.yml
    - name: Ensure incus network acl absent (socket)
      ansible.builtin.import_tasks: absent_socket.yml

    - name: Ensure incus network acl present (tls)
      ansible.builtin.import_tasks: present_tls.yml
    - name: Ensure incus network acl absent (tls)
      ansible.builtin.import_tasks: absent_tls.yml
