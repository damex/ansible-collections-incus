---
- name: Ensure incus network acl is created (tls)
  damex.incus.incus_network_acl:
    name: tls-test-acl
    description: tls test acl
    ingress:
      - action: allow
        source: 10.0.0.0/24
        protocol: tcp
        state: enabled
    state: present
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_acl_tls_present_state

- name: Ensure incus network acl is created (tls)
  ansible.builtin.assert:
    that:
      - incus_network_acl_tls_present_state is changed

- name: Ensure incus network acl is idempotent (tls)
  damex.incus.incus_network_acl:
    name: tls-test-acl
    description: tls test acl
    ingress:
      - action: allow
        source: 10.0.0.0/24
        protocol: tcp
        state: enabled
    state: present
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_acl_tls_idempotent_state

- name: Ensure incus network acl is idempotent (tls)
  ansible.builtin.assert:
    that:
      - incus_network_acl_tls_idempotent_state is not changed

- name: Ensure incus network acl info (tls)
  damex.incus.incus_network_acl_info:
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_acl_tls_info_state

- name: Ensure incus network acl info (tls)
  ansible.builtin.assert:
    that:
      - incus_network_acl_tls_info_state.network_acls is defined
      - "'tls-test-acl' in incus_network_acl_tls_info_state.network_acls | map(attribute='name')"
