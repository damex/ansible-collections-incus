---
- name: Ensure incus network acl is deleted (tls)
  damex.incus.incus_network_acl:
    name: tls-test-acl
    state: absent
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_acl_tls_absent_state

- name: Ensure incus network acl is deleted (tls)
  ansible.builtin.assert:
    that:
      - incus_network_acl_tls_absent_state is changed

- name: Ensure incus network acl deletion is idempotent (tls)
  damex.incus.incus_network_acl:
    name: tls-test-acl
    state: absent
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_acl_tls_absent_idempotent_state

- name: Ensure incus network acl deletion is idempotent (tls)
  ansible.builtin.assert:
    that:
      - incus_network_acl_tls_absent_idempotent_state is not changed
