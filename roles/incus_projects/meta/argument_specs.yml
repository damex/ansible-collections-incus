---
argument_specs:
  main:
    short_description: Ensure Incus projects.
    description:
      - Ensure Incus projects.
    examples: |
      - name: Ensure incus projects
        hosts: incus
        tasks:
          - name: Ensure incus projects
            ansible.builtin.import_role:
              name: damex.incus.incus_projects
            vars:
              incus_projects:
                - name: production
                  config:
                    features.images: "true"
                    features.profiles: "true"
                    features.networks: "true"
                    features.storage.volumes: "true"
                - name: staging
    options:
      incus_projects:
        description: Incus projects to ensure.
        type: list
        elements: dict
        options:
          name:
            description: Project name.
            required: true
            type: str
          description:
            description: Project description.
            type: str
          config:
            description: Project configuration keys.
            type: dict
            options:
              features.images:
                description: Separate image store.
                type: bool
              features.networks:
                description: Separate network management.
                type: bool
              features.networks.zones:
                description: Separate network zone management.
                type: bool
              features.profiles:
                description: Separate profile store.
                type: bool
              features.storage.buckets:
                description: Separate storage bucket management.
                type: bool
              features.storage.volumes:
                description: Separate storage volume management.
                type: bool
              limits.containers:
                description: Maximum container count.
                type: int
              limits.cpu:
                description: Maximum CPU count.
                type: int
              limits.disk:
                description: Maximum disk space.
                type: str
              limits.instances:
                description: Maximum instance count.
                type: int
              limits.memory:
                description: Maximum memory.
                type: str
              limits.networks:
                description: Maximum network count.
                type: int
              limits.processes:
                description: Maximum process count.
                type: int
              limits.virtual-machines:
                description: Maximum virtual machine count.
                type: int
              restricted:
                description: Security-sensitive feature restriction.
                type: bool
              restricted.backups:
                description: Instance and volume backup restriction.
                type: str
                choices:
                  - allow
                  - block
              restricted.cluster.groups:
                description: Allowed cluster groups, comma-separated.
                type: str
              restricted.cluster.target:
                description: Cluster member targeting.
                type: str
                choices:
                  - allow
                  - block
              restricted.containers.interception:
                description: Container system call interception.
                type: str
                choices:
                  - allow
                  - block
                  - full
              restricted.containers.lowlevel:
                description: Low-level container options.
                type: str
                choices:
                  - allow
                  - block
              restricted.containers.nesting:
                description: Container nesting.
                type: str
                choices:
                  - allow
                  - block
              restricted.containers.privilege:
                description: Privileged container settings.
                type: str
                choices:
                  - unprivileged
                  - isolated
                  - allow
              restricted.devices.disk:
                description: Disk device restriction.
                type: str
                choices:
                  - allow
                  - block
                  - managed
              restricted.devices.disk.paths:
                description: Allowed disk source paths, comma-separated.
                type: str
              restricted.devices.gpu:
                description: GPU device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.infiniband:
                description: InfiniBand device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.nic:
                description: Network device restriction.
                type: str
                choices:
                  - allow
                  - block
                  - managed
              restricted.devices.pci:
                description: PCI device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.proxy:
                description: Proxy device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.unix-block:
                description: Unix block device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.unix-char:
                description: Unix character device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.unix-hotplug:
                description: Unix hotplug device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.devices.usb:
                description: USB device allowance.
                type: str
                choices:
                  - allow
                  - block
              restricted.idmap.gid:
                description: Allowed host GID ranges for raw.idmap.
                type: str
              restricted.idmap.uid:
                description: Allowed host UID ranges for raw.idmap.
                type: str
              restricted.networks.access:
                description: Allowed networks for access, comma-separated.
                type: str
              restricted.networks.integrations:
                description: Allowed network integrations, comma-separated.
                type: str
              restricted.networks.subnets:
                description: Allowed network subnets, comma-separated.
                type: str
              restricted.networks.uplinks:
                description: Allowed network uplinks, comma-separated.
                type: str
              restricted.networks.zones:
                description: Allowed network zones, comma-separated.
                type: str
              restricted.snapshots:
                description: Instance and volume snapshot restriction.
                type: str
                choices:
                  - allow
                  - block
              restricted.virtual-machines.lowlevel:
                description: Low-level virtual machine options.
                type: str
                choices:
                  - allow
                  - block
              backups.compression_algorithm:
                description: Compression algorithm for backups.
                type: str
                choices:
                  - bzip2
                  - gzip
                  - lz4
                  - lzma
                  - xz
                  - zstd
                  - none
              images.auto_update_cached:
                description: Cached image auto-update.
                type: bool
              images.auto_update_interval:
                description: Image auto-update interval in hours.
                type: int
              images.compression_algorithm:
                description: Compression algorithm for images.
                type: str
                choices:
                  - bzip2
                  - gzip
                  - lz4
                  - lzma
                  - xz
                  - zstd
                  - none
              images.default_architecture:
                description: Default architecture for images.
                type: str
              images.remote_cache_expiry:
                description: Cached remote image expiry in days.
                type: int
              network.hwaddr_pattern:
                description: Auto-generated MAC address pattern.
                type: str
          state:
            description: Project desired state.
            type: str
            choices:
              - present
              - absent
      incus_projects_socket_path:
        description: Incus Unix socket path.
        type: path
      incus_projects_url:
        description: Incus server API URL.
        type: str
      incus_projects_client_cert:
        description: Client certificate content for API authentication.
        type: str
      incus_projects_client_key:
        description: Client key content for API authentication.
        type: str
      incus_projects_server_cert:
        description: Server certificate content for API verification.
        type: str
      incus_projects_client_cert_path:
        description: TLS client certificate path for API authentication.
        type: path
      incus_projects_client_key_path:
        description: TLS client key path for API authentication.
        type: path
      incus_projects_server_cert_path:
        description: TLS server certificate path for API verification.
        type: path
      incus_projects_token:
        description: Incus API authentication token.
        type: str
      incus_projects_validate_certs:
        description: TLS certificate validation.
        type: bool
      incus_projects_state:
        description: Projects desired state.
        type: str
        choices:
          - present
          - absent
