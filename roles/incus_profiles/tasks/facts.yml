---
- name: Ensure incus profiles cluster member facts
  damex.incus.incus_cluster_member_info:
    name: "{{ inventory_hostname }}"
    socket_path: "{{ incus_profiles_socket_path }}"
    url: "{{ incus_profiles_url | default(omit) }}"
    client_cert: "{{ incus_profiles_client_cert | default(omit) }}"
    client_key: "{{ incus_profiles_client_key | default(omit) }}"
    server_cert: "{{ incus_profiles_server_cert | default(omit) }}"
    client_cert_path: "{{ incus_profiles_client_cert_path | default(omit) }}"
    client_key_path: "{{ incus_profiles_client_key_path | default(omit) }}"
    server_cert_path: "{{ incus_profiles_server_cert_path | default(omit) }}"
    token: "{{ incus_profiles_token | default(omit) }}"
    validate_certs: "{{ incus_profiles_validate_certs }}"
    connection_timeout: "{{ incus_profiles_connection_timeout | default(omit) }}"
    connection_retry_interval: "{{ incus_profiles_connection_retry_interval | default(omit) }}"
  register: incus_profiles_cluster_info_state
  become: true
