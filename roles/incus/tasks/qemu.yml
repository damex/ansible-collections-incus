---
- name: Ensure incus qemu workarounds
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['distribution'] != "Fedora"
  become: true
  block:
    - name: Ensure incus qemu binary symlink
      ansible.builtin.file:
        src: /usr/libexec/qemu-kvm
        dest: /usr/bin/qemu-system-{{ ansible_facts['architecture'] }}
        state: link
      when: "'qemu-kvm-core' in ansible_facts.packages"

    - name: Ensure incus seabios symlink
      ansible.builtin.file:
        src: bios-256k.bin
        dest: /usr/share/seabios/bios.bin
        state: link
      when: "'seabios-bin' in ansible_facts.packages"
