---
argument_specs:
  main:
    short_description: Ensure Incus image imports.
    description:
      - Ensure Incus image imports.
    examples: |
      - name: Ensure incus image imports
        hosts: incus
        tasks:
          - name: Ensure incus image imports
            ansible.builtin.import_role:
              name: damex.incus.incus_image_imports
            vars:
              incus_image_imports:
                - alias: chr/7.22
                  source: https://download.mikrotik.com/routeros/7.22/chr-7.22.img.zip
                  properties:
                    os: RouterOS
                    release: "7.22"
                    description: MikroTik CHR 7.22
                - alias: custom/1.0
                  source: /tmp/custom-image.qcow2
                  properties:
                    os: CustomOS
                    release: "1.0"
                    description: Custom OS Image
    options:
      incus_image_imports:
        description: Image imports to ensure.
        type: list
        elements: dict
        options:
          alias:
            description: Primary image alias.
            required: true
            type: str
          aliases:
            description: Additional image aliases.
            type: list
            elements: str
          source:
            description: Local image file path or download URL.
            type: str
          architecture:
            description: Image architecture identifier.
            type: str
          properties:
            description: Image metadata properties.
            type: dict
            options:
              os:
                description: Operating system name.
                type: str
              release:
                description: Operating system release or version.
                type: str
              description:
                description: Human-readable image description.
                type: str
              variant:
                description: Image variant.
                type: str
              serial:
                description: Image serial or build identifier.
                type: str
              name:
                description: Image name.
                type: str
          checksum:
            description: Expected source file checksum.
            type: str
          checksum_algorithm:
            description: Hash algorithm used for checksum verification.
            type: str
            choices:
              - sha256
              - sha512
              - sha384
              - md5
          public:
            description: Unauthenticated user image access.
            type: bool
          force:
            description: Force re-import when alias exists.
            type: bool
          timeout:
            description: Source file download timeout in seconds.
            type: int
          project:
            description: Incus project scope.
            type: str
          state:
            description: Image desired state.
            type: str
            choices:
              - present
              - absent
      incus_image_imports_socket_path:
        description: Incus Unix socket path.
        type: path
      incus_image_imports_url:
        description: Incus server API URL.
        type: str
      incus_image_imports_client_cert:
        description: Client certificate content for API authentication.
        type: str
      incus_image_imports_client_key:
        description: Client key content for API authentication.
        type: str
      incus_image_imports_server_cert:
        description: Server certificate content for API verification.
        type: str
      incus_image_imports_client_cert_path:
        description: TLS client certificate path for API authentication.
        type: path
      incus_image_imports_client_key_path:
        description: TLS client key path for API authentication.
        type: path
      incus_image_imports_server_cert_path:
        description: TLS server certificate path for API verification.
        type: path
      incus_image_imports_token:
        description: Incus API authentication token.
        type: str
      incus_image_imports_validate_certs:
        description: TLS certificate validation.
        type: bool
      incus_image_imports_architecture:
        description: Image architecture identifier.
        type: str
      incus_image_imports_checksum_algorithm:
        description: Hash algorithm used for checksum verification.
        type: str
        choices:
          - sha256
          - sha512
          - sha384
          - md5
      incus_image_imports_public:
        description: Unauthenticated user image access.
        type: bool
      incus_image_imports_force:
        description: Force re-import when alias exists.
        type: bool
      incus_image_imports_timeout:
        description: Source file download timeout in seconds.
        type: int
      incus_image_imports_project:
        description: Incus project scope.
        type: str
      incus_image_imports_state:
        description: Images desired state.
        type: str
        choices:
          - present
          - absent
