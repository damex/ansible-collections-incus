---
argument_specs:
  main:
    short_description: Ensure Incus certificates.
    description:
      - Ensure Incus certificates.
    examples: |
      - name: Ensure incus certificates
        hosts: incus
        tasks:
          - name: Ensure incus certificates
            ansible.builtin.import_role:
              name: damex.incus.incus_certificates
            vars:
              incus_certificates:
                - name: monitoring
                  certificate: "{{ lookup('file', 'certs/monitoring.crt') }}"
                  type: client
                - name: backup
                  certificate: "{{ lookup('file', 'certs/backup.crt') }}"
                  type: client
    options:
      incus_certificates:
        description: Certificates to ensure.
        type: list
        elements: dict
        options:
          name:
            description: Certificate name.
            required: true
            type: str
          certificate:
            description: PEM-encoded certificate content.
            type: str
          type:
            description: Certificate type.
            type: str
            choices:
              - client
              - metrics
          restricted:
            description: Certificate restriction.
            type: bool
          projects:
            description: Accessible project names.
            type: list
            elements: str
          state:
            description: Certificate desired state.
            type: str
            choices:
              - present
              - absent
      incus_certificates_socket_path:
        description: Incus Unix socket path.
        type: path
      incus_certificates_url:
        description: Incus server API URL.
        type: str
      incus_certificates_client_cert:
        description: Client certificate content for API authentication.
        type: str
      incus_certificates_client_key:
        description: Client key content for API authentication.
        type: str
      incus_certificates_server_cert:
        description: Server certificate content for API verification.
        type: str
      incus_certificates_client_cert_path:
        description: TLS client certificate path for API authentication.
        type: path
      incus_certificates_client_key_path:
        description: TLS client key path for API authentication.
        type: path
      incus_certificates_server_cert_path:
        description: TLS server certificate path for API verification.
        type: path
      incus_certificates_token:
        description: Incus API authentication token.
        type: str
      incus_certificates_validate_certs:
        description: TLS certificate validation.
        type: bool
      incus_certificates_state:
        description: Certificates desired state.
        type: str
        choices:
          - present
          - absent
