---
- name: Ensure incus network zone is created (tls)
  damex.incus.incus_network_zone:
    name: tls-test.example.com
    description: tls test zone
    state: present
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_zone_tls_present_state

- name: Ensure incus network zone is created (tls)
  ansible.builtin.assert:
    that:
      - incus_network_zone_tls_present_state is changed

- name: Ensure incus network zone is idempotent (tls)
  damex.incus.incus_network_zone:
    name: tls-test.example.com
    description: tls test zone
    state: present
    url: https://127.0.0.1:8443
    client_cert_path: /tmp/tls-client.crt
    client_key_path: /tmp/tls-client.key
    server_cert_path: /tmp/incus-server.crt
  register: incus_network_zone_tls_idempotent_state

- name: Ensure incus network zone is idempotent (tls)
  ansible.builtin.assert:
    that:
      - incus_network_zone_tls_idempotent_state is not changed
