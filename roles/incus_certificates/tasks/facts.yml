---
- name: Ensure incus certificates cluster member facts
  damex.incus.incus_cluster_member_info:
    name: "{{ inventory_hostname }}"
    socket_path: "{{ incus_certificates_socket_path }}"
    url: "{{ incus_certificates_url | default(omit) }}"
    client_cert: "{{ incus_certificates_client_cert | default(omit) }}"
    client_key: "{{ incus_certificates_client_key | default(omit) }}"
    server_cert: "{{ incus_certificates_server_cert | default(omit) }}"
    client_cert_path: "{{ incus_certificates_client_cert_path | default(omit) }}"
    client_key_path: "{{ incus_certificates_client_key_path | default(omit) }}"
    server_cert_path: "{{ incus_certificates_server_cert_path | default(omit) }}"
    token: "{{ incus_certificates_token | default(omit) }}"
    validate_certs: "{{ incus_certificates_validate_certs }}"
    connection_timeout: "{{ incus_certificates_connection_timeout | default(omit) }}"
    connection_retry_interval: "{{ incus_certificates_connection_retry_interval | default(omit) }}"
  register: incus_certificates_cluster_info_state
  become: true
