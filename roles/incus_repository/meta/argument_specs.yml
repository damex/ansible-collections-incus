---
argument_specs:
  main:
    short_description: Ensure Incus repository.
    description:
      - Ensure Incus repository.
    examples: |
      - name: Ensure incus repository
        hosts: incus
        tasks:
          - name: Ensure incus repository
            ansible.builtin.import_role:
              name: damex.incus.incus_repository

      - name: Ensure incus LTS repository
        hosts: incus
        tasks:
          - name: Ensure incus LTS repository
            ansible.builtin.import_role:
              name: damex.incus.incus_repository
            vars:
              incus_repository_apt_repository_url: https://pkgs.zabbly.com/incus/lts-6.0
    options:
      incus_repository_apt_key_id:
        type: str
        description: Incus APT repository GPG key ID.
      incus_repository_apt_key_url:
        type: str
        description: Incus APT repository GPG key URL.
      incus_repository_apt_repository_name:
        type: str
        description: Incus APT repository source entry name.
      incus_repository_apt_repository_url:
        type: str
        description: Incus APT repository base URL.
      incus_repository_apt_repository_distribution:
        type: str
        description: APT repository distribution component override.
      incus_repository_apt_repository_components:
        type: list
        elements: str
        description: APT repository components.
      incus_repository_yum_repository_name:
        type: str
        description: Incus YUM repository ID.
      incus_repository_yum_repository_baseurl:
        type: str
        description: Incus YUM repository repodata directory URL.
      incus_repository_yum_repository_gpgcheck:
        type: bool
        description: Incus YUM repository GPG signature check.
      incus_repository_yum_repository_gpgkey:
        type: str
        description: Incus YUM repository ASCII-armored GPG key URL.
